<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Library — Smash AI Pro</title>
<style>
:root{--bg:#0B101D;--card:#111827;--br:#1F2937;--gold:#D4AF37;--txt:#E8E6DF;--mut:#9CA3AF}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.55 system-ui,Segoe UI,Roboto,sans-serif}
header{display:flex;gap:10px;align-items:center;padding:14px 18px;border-bottom:1px solid var(--br);position:sticky;top:0;background:var(--bg);z-index:5}
header a{color:var(--mut);text-decoration:none;border:1px solid var(--br);border-radius:999px;padding:6px 12px;font-size:13px}
header a:hover{color:var(--gold);border-color:var(--gold)}
h1{font-size:20px;margin:0;color:var(--gold);letter-spacing:.06em}
main{max-width:1120px;margin:0 auto;padding:22px 18px 70px}
.search{display:flex;gap:10px;margin:8px 0 4px}
.search input{flex:1;background:#04060d;border:1px solid var(--br);border-radius:12px;padding:13px 16px;color:var(--txt);font-size:15px}
.search select{background:#04060d;border:1px solid var(--br);border-radius:12px;color:var(--txt);padding:0 12px}
#count{color:var(--mut);font-size:13px;margin:4px 2px 14px}
h2{color:var(--gold);font-size:15px;letter-spacing:.08em;margin:30px 0 12px;text-transform:uppercase}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.card{background:var(--card);border:1px solid var(--br);border-radius:14px;padding:14px 15px;display:flex;flex-direction:column;gap:8px}
.card .cat{color:var(--gold);font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.card h3{margin:0;font-size:14.5px}
.card p{margin:0;color:var(--mut);font-size:13px}
.card .row{display:flex;gap:8px;margin-top:auto}
.card a,.card button{background:#0B101D;border:1px solid var(--br);color:var(--txt);border-radius:9px;padding:6px 10px;font-size:12px;cursor:pointer;text-decoration:none}
.card a:hover,.card button:hover{border-color:var(--gold);color:var(--gold)}
.tools .card{border-color:#2b3648}
.note{color:var(--mut);font-size:12.5px}
</style>
</head>
<body>
<header>
  <a href="/">← Studio</a>
  <h1>📚 THE LIBRARY</h1>
  <a href="/industrial">Industrial</a>
  <a href="/plc">PLC</a>
  <a href="/creative">Creative</a>
</header>
<main>
<p class="note">Everything under one roof: every tool in the building, the curated reference shelves, prompt starters and your own file vault — one search box over all of it. Type to filter; category to narrow.</p>
<div class="search">
  <input id="q" placeholder="Search the library: formulas, standards, tools, prompts…" oninput="draw()">
  <select id="cat" onchange="draw()"><option value="">All shelves</option></select>
</div>
<div id="count"></div>
<div id="hist"></div>
<h2>Tools in the building</h2>
<div class="grid tools" id="tools"></div>
<h2>Reference shelves</h2>
<div class="grid" id="shelf"></div>
<div id="server"></div>
<div id="vault"></div>
</main>
<script>
var TOOLS = [], E = [];
var signed = false, deb = null;
function esc(s){ return String(s).replace(/[&<>"]/g, function (c) { return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function adminHeaders(){ var p = ""; try { p = sessionStorage.getItem("myai.admin") || ""; } catch (e) {} var h = {}; if (p) h["X-Admin-Password"] = p; return h; }
fetch("/static/library-data.json").then(function (r) { return r.json(); }).then(function (d) {
  TOOLS = d.tools || []; E = d.entries || []; initCats(); draw();
}).catch(function () { document.getElementById("count").textContent = "shelf data failed to load"; });
fetch("/api/vault", { headers: adminHeaders() }).then(function (r) { if (r.ok) { signed = true; return r.json(); } throw 0; })
  .then(renderVault)
  .catch(function () {
    document.getElementById("vault").innerHTML = '<p class="note">🔐 The Vault is owner-only. Open the Studio and sign in (Settings) to list everything the studio holds for you and to include your uploaded files in library search.</p>';
  });
function initCats(){
  var cats = Array.from(new Set(E.map(function (x) { return x.c; })));
  var sel = document.getElementById("cat");
  sel.innerHTML = '<option value="">All shelves</option>';
  cats.forEach(function (c) { var o = document.createElement("option"); o.value = c; o.textContent = c; sel.appendChild(o); });
}
function hist(){ try { return JSON.parse(localStorage.getItem("libhist") || "[]"); } catch (e) { return []; } }
function pushHist(q){
  if (!q) return;
  var h = hist().filter(function (x) { return x !== q; }); h.unshift(q); h = h.slice(0, 6);
  localStorage.setItem("libhist", JSON.stringify(h)); drawHist();
}
function drawHist(){
  document.getElementById("hist").innerHTML = hist().map(function (q) {
    return '<button class="ask" style="display:inline-block;width:auto;margin:2px" onclick="useHist(this.textContent)">' + esc(q) + '</button>';
  }).join("");
}
function useHist(q){ document.getElementById("q").value = q; onQ(); }
function onQ(){ draw(); clearTimeout(deb); deb = setTimeout(serverSearch, 350); }
function serverSearch(){
  var q = document.getElementById("q").value.trim();
  var box = document.getElementById("server");
  if (q.length < 2) { box.innerHTML = ""; return; }
  fetch("/api/library?q=" + encodeURIComponent(q), { headers: adminHeaders() }).then(function (r) { return r.json(); }).then(function (d) {
    var s = "", h = d.hits || [];
    if (h.length) {
      s += '<h2>More from under the roof</h2><div class="grid">' + h.map(function (x) {
        return '<div class="card"><span class="cat">' + esc(x.kind) + '</span><h3>' + esc(x.n) + '</h3><p>' + esc(x.b || "") + '</p><div class="row">' +
          (x.t ? '<a href="' + x.t + '">Open →</a>' : "") + (x.u ? '<a href="' + x.u + '" target="_blank">Go →</a>' : "") + '</div></div>';
      }).join("") + '</div>';
    }
    var v = d.vault || [];
    if (v.length) {
      s += '<h2>Inside your files</h2><div class="grid">' + v.map(function (x) {
        return '<div class="card"><span class="cat">vault file</span><h3>' + esc(x.n) + '</h3><p>' + esc(x.b) + '</p></div>';
      }).join("") + '</div>';
    } else if (!signed) {
      s += '<p class="note">Tip: sign in to the Studio and this search also reaches your uploaded files.</p>';
    }
    box.innerHTML = s;
  }).catch(function () { box.innerHTML = ""; });
}
function renderVault(d){
  var f = d.files || [], s = '<h2>Your vault — everything the studio holds for you</h2><div class="grid">';
  s += f.map(function (x) {
    return '<div class="card"><span class="cat">' + esc(x.kind || "file") + '</span><h3>' + esc(x.n) + '</h3><p>' + Math.round((x.size || 0) / 1024) + ' KB</p><div class="row"><a href="' + x.u + '" target="_blank">Download</a></div></div>';
  }).join("");
  s += (d.brand || []).concat(d.films || []).map(function (x) {
    return '<div class="card"><span class="cat">asset</span><h3>' + esc(x.n) + '</h3><div class="row"><a href="' + x.u + '" target="_blank">Open →</a></div></div>';
  }).join("") + '</div>';
  document.getElementById("vault").innerHTML = s;
}
function askAI(e){ location.href = "/?ask=" + encodeURIComponent("Using this reference — " + e.n + ": " + e.b + " — explain it and give a worked example relevant to my work."); }
function draw(){
  var q = document.getElementById("q").value.toLowerCase(), c = document.getElementById("cat").value;
  document.getElementById("tools").innerHTML = TOOLS.filter(function (t) {
    return !q || (t.n + " " + t.d).toLowerCase().indexOf(q) >= 0;
  }).map(function (t) {
    return '<div class="card"><span class="cat">Tool</span><h3>' + t.n + '</h3><p>' + t.d + '</p><div class="row"><a href="' + t.h + '">Open →</a></div></div>';
  }).join("");
  var list = E.filter(function (e) {
    return (!c || e.c === c) && (!q || (e.n + " " + e.b + " " + e.c).toLowerCase().indexOf(q) >= 0);
  });
  document.getElementById("count").textContent = list.length + " reference entries on the shelves" + (q ? ' matching "' + q + '"' : "") + (c ? " · shelf: " + c : "");
  document.getElementById("shelf").innerHTML = list.map(function (e) {
    return '<div class="card"><span class="cat">' + e.c + '</span><h3>' + e.n + '</h3><p>' + e.b + '</p><div class="row">' +
      (e.t ? '<a href="' + e.t + '">Open tool →</a>' : "") +
      '<button onclick=\'askAI(' + JSON.stringify(e).replace(/'/g, "&#39;") + ')\'>Ask AI</button></div></div>';
  }).join("");
}
document.addEventListener("keydown", function (ev) {
  if (ev.key === "Enter" && document.activeElement === document.getElementById("q")) pushHist(document.getElementById("q").value.trim());
});
drawHist();

</script>
</body>
</html>
