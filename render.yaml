services:
  - type: web
    name: my-ai-pro
    runtime: docker
    region: frankfurt
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/status
    envVars:
      - key: ADMIN_PASSWORD
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: TURSO_DB_URL
        value: https://onny-ruwayne.aws-ca-central-1.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false
